<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Crinza</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
</head>
<body>

    <div class="register-wrapper">
        <div class="form-container">
            
            <form action="/register" method="POST">
                
                <div class="form-header">
                    <h2>Register Your Institute</h2>
                    <p>Join Crinza and start building your digital education business today.</p>
                </div>

                <label>Institute / Business Name</label>
                <input type="text" name="business_name" required placeholder="e.g. Sai Edtech">

                <label>Description</label>
                <textarea name="description" required placeholder="Tell us a little bit about what your business..."></textarea>

                <div class="form-row">
                    <div>
                        <label>Contact Number</label>
                        <input type="tel" name="phone" required placeholder="e.g. +91 9876543210">
                    </div>
                    <div>
                        <label>Email</label>
                        <input type="email" name="email" required placeholder="hello@institute.com">
                    </div>
                </div>

                <div class="form-row">
                    <div>
                        <label>City</label>
                        <input type="text" name="city" required placeholder="e.g. Pune">
                    </div>
                    <div>
                        <label>State (Optional)</label>
                        <input type="text" name="state" placeholder="e.g. Maharashtra">
                    </div>
                </div>

                <button type="submit">Submit Registration</button>

            </form>
        </div>
    </div>

</body>
</html>
